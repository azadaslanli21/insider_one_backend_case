version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: football_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Arsenalchampion1918.}
      POSTGRES_DB: ${DB_NAME:-football_simulator}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: football_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-Arsenalchampion1918.}
      DB_NAME: ${DB_NAME:-football_simulator}
      SERVER_PORT: ${SERVER_PORT:-8080}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  pg_data: